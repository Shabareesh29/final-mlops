name: MLOps CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Check installed versions
        run: |
          python --version
          python -c "import numpy; print('numpy:', numpy.__version__)"
          python -c "import sklearn; print('sklearn:', sklearn.__version__)"
          python -c "import joblib; print('joblib:', joblib.__version__)"
          python -c "import mlflow; print('mlflow:', mlflow.__version__)"


      - name: Check model file
        run: |
          ls -lh artifact/production_model/random_forest_model.pkl
          file artifact/production_model/random_forest_model.pkl


      - name: Check Python files
        run: |
          python -m compileall app.py src


      - name: Test FastAPI import
        run: |
          python -c "from app import app; print('FastAPI application loaded successfully')"


  docker:

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true


      - name: Build Docker image
        run: |
          docker build -t turbine-mlops-api:latest .


      - name: Verify Docker image
        run: |
          docker images turbine-mlops-api